<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration Tests Live Runner</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#5b6675; --line:#e2e6ec; --ok:#1a7f4b; --bad:#b42318; --warn:#a15c00; --info:#1d4ed8; --def:#7a3db8;
          --btn:#1d4ed8; --btnh:#1e40af; --btnb:#1d4ed8; --okbg:#e6f4ec; --badbg:#fdeceb; --warnbg:#fff4e0; --infobg:#e8effd; --defbg:#f1e8fb; --code:#f0f2f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1a2028; --ink:#e8ecf2; --mute:#9aa6b6; --line:#2b3440; --ok:#5fcf93; --bad:#ff8a80; --warn:#f5b85a; --info:#8ab4ff; --def:#c9a2f5;
          --okbg:#16301f; --badbg:#3a1c1a; --warnbg:#392a10; --infobg:#17233f; --defbg:#2b1d3f; --code:#0f1318; --btn:#17233f; --btnh:#223564; --btnb:#3a5aa6; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:4px; }
  h1 { font-size:22px; margin:0; }
  .state { font-weight:700; font-size:12px; padding:3px 12px; border-radius:999px; }
  .s-idle { background:var(--line); color:var(--mute); } .s-running { background:var(--infobg); color:var(--info); } .s-finished { background:var(--okbg); color:var(--ok); }
  .s-running::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--info); margin-right:7px; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .sub { color:var(--mute); margin:2px 0 14px; }
  .progress { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 14px; display:flex; }
  .progress i { display:block; height:100%; transition:width .3s; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .card b { display:block; font-size:24px; line-height:1.1; } .card span { color:var(--mute); font-size:12px; }
  .c-ok b { color:var(--ok); } .c-bad b { color:var(--bad); } .c-warn b { color:var(--warn); } .c-def b { color:var(--def); } .c-info b { color:var(--info); }
  .now { background:var(--infobg); border-left:4px solid var(--info); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  .now small { display:block; color:var(--mute); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--btn); color:#fff; border-color:var(--btnb); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  .bar input, .bar select, .btn { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  .bar input { flex:1; min-width:220px; } .btn { cursor:pointer; } .count { color:var(--mute); }
  .head { margin:18px 0 6px; font-weight:600; font-size:15px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; overflow:hidden; }
  .row > summary { list-style:none; cursor:pointer; position:relative; display:grid; grid-template-columns:110px minmax(0,1fr) 260px 70px auto; gap:10px; align-items:center; padding:8px 12px 8px 28px; }
  .erow > summary { grid-template-columns:70px minmax(0,1fr) 150px 170px; }
  .row > summary::-webkit-details-marker { display:none; }
  .row > summary:hover, .ex > summary:hover { background:var(--infobg); }
  .row > summary::before, .ex > summary::before { content:"\25B6"; color:var(--info); position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:11px; transition:transform .12s; }
  .row[open] > summary::before, .ex[open] > summary::before { transform:translateY(-50%) rotate(90deg); }
  .row[open] > summary { border-bottom:1px solid var(--line); background:var(--bg); }
  .path { font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all; } .path small { display:block; color:var(--mute); font-family:inherit; }
  .m { display:inline-block; min-width:54px; text-align:center; font-weight:700; font-size:11px; padding:2px 6px; border-radius:5px; color:#fff; }
  .GET { background:#1d7a46; } .POST { background:#1d4ed8; } .PUT { background:#a15c00; } .DELETE { background:#b42318; } .PATCH { background:#6b46c1; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; text-align:center; }
  .p-passed, .p-auto { background:var(--okbg); color:var(--ok); } .p-failed, .p-no { background:var(--badbg); color:var(--bad); }
  .p-defect { background:var(--defbg); color:var(--def); } .p-skipped { background:var(--warnbg); color:var(--warn); }
  .p-queued { background:var(--line); color:var(--mute); } .p-running { background:var(--infobg); color:var(--info); }
  .nums, .gname { color:var(--mute); font-size:12px; } .nums b { font-weight:700; }
  .n-pass { color:var(--ok); } .n-def { color:var(--def); } .n-fail { color:var(--bad); } .n-skip { color:var(--warn); }
  .body { padding:10px 12px 12px; }
  .note { background:var(--warnbg); border-left:4px solid var(--warn); padding:8px 12px; border-radius:6px; margin:4px 0; }
  .err { background:var(--badbg); border-left:4px solid var(--bad); padding:8px 12px; border-radius:6px; margin:6px 0; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace,Consolas,monospace; }
  .ex { border:1px solid var(--line); border-radius:8px; margin:8px 0; }
  .ex > summary { cursor:pointer; position:relative; padding:7px 10px 7px 28px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; list-style:none; }
  .ex > summary::-webkit-details-marker { display:none; }
  .ex[open] > summary { border-bottom:1px solid var(--line); }
  .st { font-weight:700; } .st.ok { color:var(--ok); } .st.no { color:var(--bad); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
  .cols h4 { margin:0 0 4px; font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  pre { margin:0; background:var(--code); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; max-height:360px; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }

  .btn.ado { background:var(--btn); color:#fff; border-color:var(--btnb); font-weight:600; } .btn.ado:hover:not(:disabled) { background:var(--btnh); }
  .btn.ado:disabled { opacity:.5; cursor:default; }
  .btn.ado.small { padding:3px 10px; font-size:12px; white-space:nowrap; }
  a.link { color:var(--info); cursor:pointer; text-decoration:underline; font-size:12px; }
  .empty { color:var(--mute); padding:20px; text-align:center; }
  /* narrow screens: the result, title and timing stack, but the ADO button stays on the same line, at the right of the row */
  @media (max-width:760px) { .row > summary, .erow > summary { grid-template-columns:minmax(0,1fr) auto; } .row > summary > :not(.btn) { grid-column:1; } .row > summary > .btn.ado { grid-column:2; grid-row:1 / span 4; align-self:center; } .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Integration Tests Live Runner</h1><span id="state" class="state s-idle">WAITING FOR A RUN</span>
    <select id="runs" class="btn" title="Open a saved run"><option value="">Saved runs</option></select></div>
  <p class="sub" id="sub">Start the suite with <code>npm test</code>; tests appear here as they run.</p>
  <div class="progress" id="progress"><i style="background:var(--ok)"></i><i style="background:var(--def)"></i><i style="background:var(--bad)"></i><i style="background:var(--warn)"></i></div>
  <div class="cards" id="cards"></div>
  <div class="now" id="now" hidden></div>

  <div class="tabs"><button class="tab on" data-tab="tc">Test cases</button><button class="tab" data-tab="ep">Endpoints</button></div>

  <section id="tc">
    <div class="bar">
      <input id="tcq" type="search" placeholder="Search scenario, group, file or error">
      <select id="tcf"><option value="">All results</option><option value="running">Running</option><option value="queued">Waiting</option><option value="passed">Passed</option><option value="failed">Failed (unexpected)</option><option value="defect">Failed (known server defect)</option><option value="skipped">Skipped</option></select>
      <button class="btn" id="tcx">Open failing</button><button class="btn" id="tcz">Close all</button>
      <span class="count" id="tcc"></span>
    </div>
    <div id="tclist"></div>
  </section>

  <section id="ep" hidden>
    <div class="bar">
      <input id="epq" type="search" placeholder="Search endpoint, tag or description">
      <select id="epf"><option value="">All endpoints</option><option value="auto">Automated</option><option value="no">Not automated</option><option value="fail">Has real failures (red)</option><option value="defect">Has known defects (purple)</option></select>
      <span class="count" id="epc"></span>
    </div>
    <div id="eplist"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = { passed: 'PASSED', failed: 'FAILED', defect: 'KNOWN DEFECT', skipped: 'SKIPPED', queued: 'WAITING', running: 'RUNNING' };
const ORDER = ['running', 'failed', 'defect', 'skipped', 'queued', 'passed'];
const tests = new Map();       // id -> light test
let run = { status: 'idle', startedAt: null, finishedAt: null, dealer: '' };
let wanted = [];                // ids rendered in order
const openIds = new Set();      // test rows the user has open (kept across re-renders)

function el(tag, cls, text, kids) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  (kids || []).forEach((k) => k && n.appendChild(k));
  return n;
}
const pill = (s) => el('span', 'pill p-' + s, LABEL[s]);
const method = (m) => el('span', 'm ' + m, m);
const fmtDur = (ms) => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return m ? m + ' min ' + (s % 60) + ' s' : s + ' s'; };

// ---- header, cards, progress ----
function count(s) { let n = 0; tests.forEach((t) => { if (t.status === s) n++; }); return n; }
function renderHeader() {
  const total = tests.size, done = total - count('queued') - count('running');
  const st = $('state');
  st.className = 'state s-' + run.status;
  st.textContent = run.status === 'running' ? 'RUNNING' : run.status === 'finished' ? 'FINISHED' : 'WAITING FOR A RUN';
  $('sub').textContent = run.startedAt ? `Dealer ${run.dealer} - started ${new Date(run.startedAt).toLocaleTimeString()}` +
    (run.status === 'finished' ? ` - ended ${new Date(run.finishedAt).toLocaleTimeString()} - took ${fmtDur(new Date(run.finishedAt) - new Date(run.startedAt))}` : ` - ${fmtDur(Date.now() - new Date(run.startedAt))} so far`) +
    ` - ${done} of ${total} tests done` : 'Start the suite with npm test; tests appear here as they run.';
  const cards = [[total, 'test cases', ''], [count('passed'), 'passed', 'c-ok'], [count('defect'), 'failed: known server defects', 'c-def'], [count('failed'), 'failed: unexpected', 'c-bad'],
    [count('skipped'), 'skipped', 'c-warn'], [count('queued') + count('running'), 'still to finish', 'c-info']];
  $('cards').replaceChildren(...cards.map(([n, l, c]) => el('div', 'card ' + c, null, [el('b', '', n), el('span', '', l)])));
  const bars = $('progress').children;
  [count('passed'), count('defect'), count('failed'), count('skipped')].forEach((n, i) => { bars[i].style.width = (total ? (n / total) * 100 : 0) + '%'; });
  const running = [...tests.values()].find((t) => t.status === 'running');
  $('now').hidden = !running;
  if (running) $('now').replaceChildren(el('b', '', 'Running now: ' + running.title), el('small', '', running.group + '  |  ' + running.file));
}

// ---- test rows ----
function exchange(x, open) {
  const ok = x.status >= 200 && x.status < 300;
  const d = el('details', 'ex');
  d.open = open;
  d.appendChild(el('summary', '', null, [method(x.method), el('span', 'path', x.url), el('span', 'st ' + (ok ? 'ok' : 'no'), x.error ? 'ERROR' : 'HTTP ' + x.status), el('span', 'nums', x.ms + ' ms')]));
  d.appendChild(el('div', 'cols', null, [
    el('div', '', null, [el('h4', '', 'Request payload'), el('pre', '', x.request === undefined ? '(no body)' : x.request)]),
    el('div', '', null, [el('h4', '', 'Response'), el('pre', '', x.error ? x.error : x.response === undefined || x.response === '' ? '(empty body)' : x.response)]),
  ]));
  return d;
}

async function fillBody(d, t, focusEndpoint) {
  const body = el('div', 'body', 'Loading...');
  d.appendChild(body);
  const detail = await (await fetch('/api/test/' + encodeURIComponent(t.id))).json();
  body.replaceChildren(el('div', 'gname', `${t.file}:${t.line}` + (t.group ? '  |  ' + t.group : '')));
  if (detail.skipReason) body.appendChild(el('div', 'note', 'Skipped: ' + detail.skipReason));
  if (detail.error) body.appendChild(el('div', 'err', detail.error));
  const list = focusEndpoint ? detail.exchanges.filter((x) => x.endpoint === focusEndpoint) : detail.exchanges;
  if (!detail.exchanges.length) body.appendChild(el('div', 'gname', t.status === 'skipped' ? 'No requests were sent.' : 'No requests were recorded for this test.'));
  list.forEach((x) => body.appendChild(exchange(x, t.status !== 'passed' && (focusEndpoint || detail.exchanges.length <= 2))));
}

// Opens the page that shows what will be published to ADO for this one test (nothing is created until Create is clicked there).
function bugButton(t) {
  const b = el('button', 'btn ado small', 'Create a defect on ADO');
  b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); window.open('/bug?id=' + encodeURIComponent(t.id), '_blank'); });
  return b;
}
const testSummary = (t) => el('summary', '', null, [pill(t.status), el('span', '', t.title), el('span', 'gname', t.group || t.file), el('span', 'nums', t.status === 'queued' || t.status === 'running' ? '' : t.ms + ' ms'),
  t.status === 'defect' || t.status === 'failed' ? bugButton(t) : null]);
const rowFor = new Map(); // id -> row in the test list

function testRow(t, focusEndpoint) {
  const d = el('details', 'row');
  d.id = (focusEndpoint ? 'e-' : 't-') + t.id;
  d.appendChild(testSummary(t));
  if (!focusEndpoint) rowFor.set(t.id, d);
  let loaded = false;
  d.addEventListener('toggle', () => {
    if (!focusEndpoint) d.open ? openIds.add(t.id) : openIds.delete(t.id);
    if (d.open && !loaded) { loaded = true; fillBody(d, t, focusEndpoint); }
  });
  if (!focusEndpoint && openIds.has(t.id)) d.open = true;
  return d;
}

function renderTests() {
  const q = $('tcq').value.toLowerCase(), f = $('tcf').value;
  const list = [...tests.values()].filter((t) => (!f || t.status === f) && (!q || (t.title + ' ' + t.group + ' ' + t.file + ' ' + t.error + ' ' + t.skipReason).toLowerCase().includes(q)));
  $('tcc').textContent = list.length + ' of ' + tests.size + ' test cases';
  const box = $('tclist');
  const scroll = window.scrollY;
  box.replaceChildren();
  rowFor.clear();
  if (!list.length) box.appendChild(el('div', 'empty', tests.size ? 'No test cases match.' : 'No run yet. Start the suite with npm test.'));
  let last = '';
  list.forEach((t) => {
    if (t.file !== last) { last = t.file; box.appendChild(el('div', 'head', t.file)); }
    box.appendChild(testRow(t));
  });
  window.scrollTo(0, scroll);
}

// ---- endpoints ----
async function renderEndpoints() {
  const E = await (await fetch('/api/endpoints')).json();
  const q = $('epq').value.toLowerCase(), f = $('epf').value;
  const list = E.filter((e) => (!f || (f === 'auto' && e.automated) || (f === 'no' && !e.automated) || (f === 'fail' && e.failed > 0) || (f === 'defect' && e.defect > 0)) &&
    (!q || (e.path + ' ' + e.tag + ' ' + e.summary + ' ' + e.method).toLowerCase().includes(q)));
  $('epc').textContent = list.length + ' of ' + E.length + ' endpoints';
  const box = $('eplist'); box.replaceChildren();
  if (!E.length) box.appendChild(el('div', 'empty', 'The API spec has not been downloaded yet; it appears when a run starts.'));
  let last = '';
  list.forEach((e) => {
    if (e.tag !== last) { last = e.tag; const g = E.filter((x) => x.tag === e.tag); box.appendChild(el('div', 'head', `${e.tag}  (${g.filter((x) => x.automated).length}/${g.length} automated)`)); }
    const d = el('details', 'row erow');
    d.appendChild(el('summary', '', null, [method(e.method), el('span', 'path', e.path, [e.summary ? el('small', '', e.summary) : null]),
      el('span', 'pill ' + (e.automated ? 'p-auto' : 'p-no'), e.automated ? 'AUTOMATED' : 'NOT AUTOMATED'),
      el('span', 'nums', null, e.automated ? [el('b', 'n-pass', e.passed + ' pass'), document.createTextNode(' / '), el('b', 'n-def', e.defect + ' known defect'), document.createTextNode(' / '), el('b', 'n-fail', e.failed + ' fail'), document.createTextNode(' / '), el('b', 'n-skip', e.skipped + ' skip')] : [])]));
    d.addEventListener('toggle', () => {
      if (!d.open || d.dataset.done) return;
      d.dataset.done = 1;
      const b = el('div', 'body');
      if (!e.automated) b.appendChild(el('div', 'note', e.note));
      else {
        b.appendChild(el('div', 'gname', 'Scenarios that send a request to this endpoint:'));
        e.tests.sort((a, c) => ORDER.indexOf(a.status) - ORDER.indexOf(c.status)).forEach((t) => {
          const full = tests.get(t.id);
          const r = testRow(full, e.key);
          if (t.status === 'failed' || t.status === 'defect') r.open = true;
          b.appendChild(r);
        });
      }
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}

// ---- wiring ----
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  $('tc').hidden = b.dataset.tab !== 'tc'; $('ep').hidden = b.dataset.tab !== 'ep';
  if (b.dataset.tab === 'ep') renderEndpoints();
}));
['tcq', 'tcf'].forEach((id) => $(id).addEventListener('input', renderTests));
['epq', 'epf'].forEach((id) => $(id).addEventListener('input', renderEndpoints));
$('tcx').addEventListener('click', () => document.querySelectorAll('#tclist > details').forEach((d) => { if (/FAILED|KNOWN DEFECT/.test(d.querySelector('summary').innerText)) d.open = true; }));
$('tcz').addEventListener('click', () => document.querySelectorAll('#tclist details[open]').forEach((d) => (d.open = false)));

function applyState(s) {
  tests.clear();
  s.tests.forEach((t) => tests.set(t.id, t));
  run = s;
  openIds.clear();
  renderHeader(); renderTests();
  if (!$('ep').hidden) renderEndpoints();
}

// Test events can arrive in bursts; redraw at most a few times a second.
// A changed test only has its own row's summary replaced, so rows the user has open stay as they are.
let pending = false;
const dirty = new Set();
function schedule() {
  if (pending) return;
  pending = true;
  setTimeout(() => {
    pending = false;
    renderHeader();
    const filtered = $('tcq').value || $('tcf').value;
    if (filtered) renderTests();
    else dirty.forEach((id) => { const row = rowFor.get(id); if (row) row.replaceChild(testSummary(tests.get(id)), row.querySelector('summary')); });
    dirty.clear();
  }, 400);
}

const source = new EventSource('/events');
source.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === 'state') applyState(ev.state);
  else if (ev.type === 'test') { tests.set(ev.test.id, ev.test); dirty.add(ev.test.id); run.status = run.status === 'idle' ? 'running' : run.status; schedule(); }
};
setInterval(() => { if (run.status === 'running') renderHeader(); }, 1000);

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  // Module name - date - time - day, e.g. "Login and tokens - 30 Oct 2026 - 9:23 pm - Friday"
  const nice = (r) => { const d = new Date(r.startedAt); return isNaN(d) ? r.file : [r.name, d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }), d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase(), d.toLocaleDateString('en-US', { weekday: 'long' })].join(' - '); };
  $('runs').replaceChildren(new Option('Saved runs', ''), ...runs.map((r) => new Option(nice(r), r.file)));
}
$('runs').addEventListener('change', async () => {
  if (!$('runs').value) return;
  const r = await fetch('/api/load', { method: 'POST', body: JSON.stringify({ file: $('runs').value }) });
  if (!r.ok) alert((await r.json()).error);
});
loadRuns();
setInterval(loadRuns, 15000);
</script>
</body>
</html>
