<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration Tests Live Runner</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#5b6675; --line:#e2e6ec; --ok:#1a7f4b; --bad:#b42318; --warn:#a15c00; --info:#1d4ed8; --def:#7a3db8;
          --btn:#1d4ed8; --btnh:#1e40af; --btnb:#1d4ed8; --okbg:#e6f4ec; --badbg:#fdeceb; --warnbg:#fff4e0; --infobg:#e8effd; --defbg:#f1e8fb; --code:#f0f2f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1a2028; --ink:#e8ecf2; --mute:#9aa6b6; --line:#2b3440; --ok:#5fcf93; --bad:#ff8a80; --warn:#f5b85a; --info:#8ab4ff; --def:#c9a2f5;
          --okbg:#16301f; --badbg:#3a1c1a; --warnbg:#392a10; --infobg:#17233f; --defbg:#2b1d3f; --code:#0f1318; --btn:#17233f; --btnh:#223564; --btnb:#3a5aa6; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  /* Everything a little smaller, evenly, so the proportions stay the same (Edge/Chrome page zoom). */
  html { zoom:0.9; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Nunito","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  .wrap { max-width:1420px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:4px; }
  /* The Saved runs menu takes the spare width, so the header lines up with the content's right edge (Reset sits flush right). */
  /* Header: title on the left, Run / Reset on the right. Report Analysis and Saved runs are in the side menu. */
  .top .spacer { flex:1; }
  /* Run, Stop and Reset are the same size. */
  #gorun, #gostop, #goreset { min-width:96px; height:40px; padding:0 18px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  h1 { font-size:22px; margin:0; }
  .state { font-weight:700; font-size:12px; padding:3px 12px; border-radius:999px; }
  .s-idle { background:var(--line); color:var(--mute); } .s-running { background:var(--infobg); color:var(--info); } .s-finished { background:var(--okbg); color:var(--ok); }
  .s-running::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--info); margin-right:7px; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .sub { color:var(--mute); margin:2px 0 14px; }
  .progress { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 14px; display:flex; }
  .progress i { display:block; height:100%; transition:width .3s; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .card b { display:block; font-size:24px; line-height:1.1; } .card span { color:var(--mute); font-size:12px; }
  .c-ok b { color:var(--ok); } .c-bad b { color:var(--bad); } .c-warn b { color:var(--warn); } .c-def b { color:var(--def); } .c-info b { color:var(--info); }
  .now { background:var(--infobg); border-left:4px solid var(--info); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  .now small { display:block; color:var(--mute); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; align-items:center; }
  /* Generate Report: shown at the right of the tabs once a run has finished (or a saved run is open). */
  .genrep { margin-left:auto; text-decoration:none; height:40px; padding:0 18px; display:inline-flex; align-items:center; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--btn); color:#fff; border-color:var(--btnb); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  .bar input, .bar select, .btn { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  .bar input { flex:1; min-width:220px; } .btn { cursor:pointer; } .count { color:var(--mute); }
  /* Search boxes sit at the right end of their row, with a magnifying glass inside on the right. */
  .bar .search { position:relative; display:block; margin-left:auto; width:360px; max-width:100%; }
  .bar .search input { width:100%; min-width:0; padding-right:34px; }
  .bar .search svg { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--mute); pointer-events:none; }
  .bar .search input::-webkit-search-cancel-button { margin-right:4px; }
  @media (max-width:760px) { .bar .search { width:100%; margin-left:0; } }
  .head { margin:18px 0 6px; font-weight:600; font-size:15px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; overflow:hidden; }
  .row > summary { list-style:none; cursor:pointer; position:relative; display:grid; grid-template-columns:110px minmax(0,1fr) 260px 70px auto; gap:10px; align-items:center; padding:8px 12px 8px 28px; }
  .erow > summary { grid-template-columns:70px minmax(0,1fr) 150px 170px; }
  .row > summary::-webkit-details-marker { display:none; }
  .row > summary:hover, .ex > summary:hover { background:var(--infobg); }
  .row > summary::before, .ex > summary::before { content:"\25B6"; color:var(--info); position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:11px; transition:transform .12s; }
  .row[open] > summary::before, .ex[open] > summary::before { transform:translateY(-50%) rotate(90deg); }
  .row[open] > summary { border-bottom:1px solid var(--line); background:var(--bg); }
  /* Test names: a soft, rounded font (Nunito; falls back to the system font when offline). */
  /* Softer than the page's main text colour, so the test names do not glare (light and dark). */
  .ttl { color:#3a4655; }
  @media (prefers-color-scheme: dark) { .ttl { color:#bcc5d1; } }
  .ttl { font-family:"Nunito","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; font-size:15px; font-weight:500; letter-spacing:.15px; line-height:1.4;
         -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
  .path { font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all; } .path small { display:block; color:var(--mute); font-family:inherit; }
  .m { display:inline-block; min-width:54px; text-align:center; font-weight:700; font-size:11px; padding:2px 6px; border-radius:5px; color:#fff; }
  .GET { background:#1d7a46; } .POST { background:#1d4ed8; } .PUT { background:#a15c00; } .DELETE { background:#b42318; } .PATCH { background:#6b46c1; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; text-align:center; }
  .p-passed, .p-auto { background:var(--okbg); color:var(--ok); } .p-failed, .p-no { background:var(--badbg); color:var(--bad); }
  .p-defect { background:var(--defbg); color:var(--def); } .p-skipped { background:var(--warnbg); color:var(--warn); }
  .p-queued { background:var(--line); color:var(--mute); } .p-running { background:var(--infobg); color:var(--info); }
  .nums, .gname { color:var(--mute); font-size:12px; } .nums b { font-weight:700; }
  .n-pass { color:var(--ok); } .n-def { color:var(--def); } .n-fail { color:var(--bad); } .n-skip { color:var(--warn); }
  .body { padding:10px 12px 12px; }
  .plain { background:var(--warnbg); border-left:4px solid var(--warn); padding:10px 14px; border-radius:6px; margin:6px 0; }
  .plain b { display:block; margin-bottom:2px; } .plain.net { background:var(--infobg); border-color:var(--info); } .plain.net b { color:var(--info); }
  .note { background:var(--warnbg); border-left:4px solid var(--warn); padding:8px 12px; border-radius:6px; margin:4px 0; }
  .note.info { background:var(--infobg); border-left-color:var(--info); }
  .now .paused { display:block; margin-top:4px; color:var(--warn); font-weight:600; }
  .err { background:var(--badbg); border-left:4px solid var(--bad); padding:8px 12px; border-radius:6px; margin:6px 0; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace,Consolas,monospace; }
  .ex { border:1px solid var(--line); border-radius:8px; margin:8px 0; }
  .ex > summary { cursor:pointer; position:relative; padding:7px 10px 7px 28px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; list-style:none; }
  .ex > summary::-webkit-details-marker { display:none; }
  .ex[open] > summary { border-bottom:1px solid var(--line); }
  .st { font-weight:700; } .st.ok { color:var(--ok); } .st.no { color:var(--bad); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
  .cols h4 { margin:0 0 4px; font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  pre { margin:0; background:var(--code); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; max-height:360px; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
  pre.json { padding:10px 12px; line-height:1.5; tab-size:2; }
  .pl { min-width:0; } .plhead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; } .plhead h4 { margin:0 !important; }
  .copy { background:var(--card); color:var(--mute); border:1px solid var(--line); border-radius:6px; padding:1px 9px; font:12px "Nunito","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; cursor:pointer; }
  .copy:hover { color:var(--ink); background:var(--infobg); }
  .json .jk { color:#0b5cad; } .json .js { color:#1a7f4b; } .json .jn { color:#b45309; } .json .jb { color:#7a3db8; font-weight:600; } .json .jz { color:#7a3db8; font-style:italic; } .json .jp { color:#7b8494; }
  @media (prefers-color-scheme: dark) { .json .jk { color:#8ab4ff; } .json .js { color:#7ee2a8; } .json .jn { color:#f5b85a; } .json .jb, .json .jz { color:#d2a8ff; } .json .jp { color:#8b95a5; } }
  @media (max-width:760px) { .cols { grid-template-columns:1fr; } }

  .btn.ado { background:var(--btn); color:#fff; border-color:var(--btnb); font-weight:600; } .btn.ado:hover:not(:disabled) { background:var(--btnh); }
  .btn.ado:disabled { opacity:.5; cursor:default; }
  .btn.ado.small { padding:3px 10px; font-size:12px; white-space:nowrap; }
  a.link { color:var(--info); cursor:pointer; text-decoration:underline; font-size:12px; }
  .empty { color:var(--mute); padding:20px; text-align:center; }
  /* narrow screens: the result, title and timing stack, but the ADO button stays on the same line, at the right of the row */
  @media (max-width:760px) { .row > summary, .erow > summary { grid-template-columns:minmax(0,1fr) auto; } .row > summary > :not(.btn) { grid-column:1; } .row > summary > .btn.ado { grid-column:2; grid-row:1 / span 4; align-self:center; } .cols { grid-template-columns:1fr; } }
  .modname { color:var(--mute); font-weight:600; }
  /* Page title as a breadcrumb: Home > the module (Home goes back to the module boxes). */
  #crumbs { display:flex; align-items:center; gap:10px; }
  #crumbs .crumb { color:var(--mute); text-decoration:none; font-weight:600; padding:2px 8px; margin:-2px -8px; border-radius:8px; transition:background .12s, color .12s; }
  /* Hover like the app's other buttons and menu items: the soft tint background and the main text colour, no underline. */
  #crumbs .crumb:hover { color:var(--ink); background:var(--infobg); text-decoration:none; }
  #crumbs .sep { color:var(--mute); font-weight:400; }
  .plainrow { display:grid; grid-template-columns:110px minmax(0,1fr) 260px; gap:10px; align-items:center; padding:8px 12px; }
  @media (max-width:760px) { .plainrow { grid-template-columns:minmax(0,1fr); } }
  .modrow { display:grid; grid-template-columns:minmax(180px,1.2fr) minmax(120px,2fr) 150px 50px; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:6px; color:var(--ink); text-decoration:none; }
  .modrow:hover { background:var(--infobg); }
  .modbar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; } .modbar i { display:block; height:100%; background:var(--ok); }
  #covmods { margin-bottom:14px; } #covmods .head { margin-top:6px; }
  @media (max-width:760px) { .modrow { grid-template-columns:1fr auto; } .modbar { grid-column:1 / span 2; } }
  .msg { margin:6px 0 10px; padding:8px 12px; border-radius:8px; background:var(--infobg); color:var(--info); white-space:pre-wrap; word-break:break-word; }
  .msg.bad { background:var(--badbg); color:var(--bad); }
  .runbtn { background:var(--btn); color:#fff; border:1px solid var(--btnb); border-radius:8px; padding:9px 26px; font:inherit; font-weight:700; cursor:pointer; }
  .runbtn:hover:not(:disabled) { background:var(--btnh); } .runbtn:disabled { opacity:.5; cursor:default; }
  /* The run details line sits right under the title. */
  .subrow { display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin:2px 0 14px; } .subrow .sub { margin:0; }
</style>
<script src="/json-view.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap">
<script src="/nav.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="crumbs"><a class="crumb" href="/runner">Home</a><span class="sep" aria-hidden="true">&rsaquo;</span><span id="crumbname">Live run</span></h1><span id="state" class="state s-idle">WAITING FOR A RUN</span><span class="spacer"></span>
    <span id="modname" class="modname" hidden></span><button class="runbtn" id="gorun" hidden>Run</button><button class="btn" id="gostop" hidden>Stop</button><button class="btn" id="goreset" hidden title="Clear this page and show the Run button again">Reset</button></div>
  <p class="msg" id="modmsg" hidden></p>
  <div class="subrow"><p class="sub" id="sub">Start the suite with <code>npm test</code>; tests appear here as they run.</p></div>
  <div class="progress" id="progress"><i style="background:var(--ok)"></i><i style="background:var(--def)"></i><i style="background:var(--bad)"></i><i style="background:var(--warn)"></i></div>
  <div class="cards" id="cards"></div>
  <div class="now" id="now" hidden></div>

  <div class="tabs"><button class="tab on" data-tab="tc">Test cases</button><button class="tab" data-tab="cov" id="covtab" hidden>Coverage</button><button class="tab" data-tab="ep">Endpoints</button>
    <a class="runbtn genrep" id="genrep" target="_blank" hidden title="The report of this run: results per module, failures in plain words, endpoints, timing, and a PDF">Generate Report</a></div>

  <section id="tc">
    <div class="bar">
      <select id="tcf"><option value="">All results</option><option value="running">Running</option><option value="queued">Waiting</option><option value="passed">Passed</option><option value="failed">Failed (unexpected)</option><option value="defect">Failed (known server defect)</option><option value="skipped">Skipped</option></select>
      <button class="btn" id="tcx">Open failing</button><button class="btn" id="tcz">Close all</button>
      <span class="count" id="tcc"></span>
      <label class="search"><input id="tcq" type="search" placeholder="Search scenario, group, file or error" aria-label="Search scenario, group, file or error"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></label>
    </div>
    <div id="tclist"></div>
  </section>

  <section id="cov" hidden>
    <div class="cards" id="covcards"></div>
    <div class="bar">
      <select id="covf"><option value="">All endpoints of this module</option><option value="covered">Covered</option><option value="not">Not covered yet</option></select>
      <span class="count" id="covc"></span>
      <label class="search"><input id="covq" type="search" placeholder="Search endpoint, tag or description" aria-label="Search endpoint, tag or description"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></label>
    </div>
    <div id="covmods" hidden></div>
    <div id="covlist"></div>
  </section>

  <section id="ep" hidden>
    <div class="bar">
      <select id="epf"><option value="">All endpoints</option><option value="auto">Automated</option><option value="no">Not automated</option><option value="fail">Has real failures (red)</option><option value="defect">Has known defects (purple)</option></select>
      <span class="count" id="epc"></span>
      <label class="search"><input id="epq" type="search" placeholder="Search endpoint, tag or description" aria-label="Search endpoint, tag or description"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></label>
    </div>
    <div id="eplist"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = { passed: 'PASSED', failed: 'FAILED', defect: 'KNOWN DEFECT', skipped: 'SKIPPED', queued: 'WAITING', running: 'RUNNING' };
const ORDER = ['running', 'failed', 'defect', 'skipped', 'queued', 'passed'];
const tests = new Map();       // id -> light test
let run = { status: 'idle', startedAt: null, finishedAt: null, dealer: '' };
let wanted = [];                // ids rendered in order
const openIds = new Set();      // test rows the user has open (kept across re-renders)

function el(tag, cls, text, kids) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  (kids || []).forEach((k) => k && n.appendChild(k));
  return n;
}
const pill = (s) => el('span', 'pill p-' + s, LABEL[s]);
const method = (m) => el('span', 'm ' + m, m);
const fmtDur = (ms) => { const s = Math.round(ms / 1000), m = Math.floor(s / 60); return m ? m + ' min ' + (s % 60) + ' s' : s + ' s'; };

// ---- header, cards, progress ----
function count(s) { let n = 0; tests.forEach((t) => { if (t.status === s) n++; }); return n; }
function renderHeader() {
  const total = tests.size, done = total - count('queued') - count('running');
  const st = $('state');
  st.className = 'state s-' + run.status;
  st.textContent = run.status === 'running' ? 'RUNNING' : run.status === 'finished' ? 'FINISHED' : 'WAITING FOR A RUN';
  // Without a module in the address (a run started elsewhere, or a saved run opened from the menu): Home > that run's module.
  if (!new URLSearchParams(location.search).get('module')) $('crumbname').textContent = run.label || 'Live run';
  // Generate Report: once the run has finished, link to the report of its saved file (the same name the server saves it under).
  const done1 = run.status === 'finished' && !!run.startedAt;
  $('genrep').hidden = !done1;
  if (done1) $('genrep').href = '/run-report?file=' + encodeURIComponent('run-' + run.startedAt.replace(/[:.]/g, '-') + '.json');
  $('sub').textContent = run.startedAt ? `Dealer ${run.dealer} - started ${new Date(run.startedAt).toLocaleTimeString()}` +
    (run.status === 'finished' ? ` - ended ${new Date(run.finishedAt).toLocaleTimeString()} - took ${fmtDur(new Date(run.finishedAt) - new Date(run.startedAt))}` : ` - ${fmtDur(Date.now() - new Date(run.startedAt))} so far`) +
    ` - ${done} of ${total} tests done` : 'Not run yet. Click Run (or start the suite with npm test); the tests appear here as they run.';
  const cards = [[total, 'test cases', ''], [count('passed'), 'passed', 'c-ok'], [count('defect'), 'failed: known server defects', 'c-def'], [count('failed'), 'failed: unexpected', 'c-bad'],
    [count('skipped'), 'skipped', 'c-warn'], [count('queued') + count('running'), 'still to finish', 'c-info']];
  $('cards').replaceChildren(...cards.map(([n, l, c]) => el('div', 'card ' + c, null, [el('b', '', n), el('span', '', l)])));
  const bars = $('progress').children;
  [count('passed'), count('defect'), count('failed'), count('skipped')].forEach((n, i) => { bars[i].style.width = (total ? (n / total) * 100 : 0) + '%'; });
  const running = [...tests.values()].find((t) => t.status === 'running');
  $('now').hidden = !running;
  if (running) $('now').replaceChildren(el('b', '', 'Running now: ' + running.title), el('small', '', running.group + '  |  ' + running.file), ...pauseNote());
}

// ---- test rows ----
/** A payload block: pretty, coloured JSON (plain text stays as it is) with a Copy button. */
function payload(heading, text, isBody) {
  const pre = el('pre', 'json');
  if (isBody && window.JsonView) pre.innerHTML = JsonView.html(text); else pre.textContent = text;
  const copy = el('button', 'copy', 'Copy');
  copy.type = 'button';
  copy.addEventListener('click', async (e) => {
    e.preventDefault();
    const value = isBody && window.JsonView ? JsonView.pretty(text) : text;
    try { await navigator.clipboard.writeText(value); copy.textContent = 'Copied'; } catch { copy.textContent = 'Copy failed'; }
    setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
  });
  return el('div', 'pl', null, [el('div', 'plhead', null, [el('h4', '', heading), isBody ? copy : null].filter(Boolean)), pre]);
}

function exchange(x, open) {
  const ok = x.status >= 200 && x.status < 300;
  const d = el('details', 'ex');
  d.open = open;
  d.appendChild(el('summary', '', null, [method(x.method), el('span', 'path', x.url), el('span', 'st ' + (ok ? 'ok' : 'no'), x.error ? 'ERROR' : 'HTTP ' + x.status), el('span', 'nums', x.ms + ' ms')]));
  const hasReq = x.request !== undefined && x.request !== '', hasRes = !x.error && x.response !== undefined && x.response !== '';
  d.appendChild(el('div', 'cols', null, [
    payload('Request payload', hasReq ? x.request : '(no body)', hasReq),
    payload('Response', x.error ? x.error : hasRes ? x.response : '(empty body)', hasRes),
  ]));
  return d;
}

// The reason for a failure in plain words, for people who do not read error messages.
// Returns { net: true } for problems of the test machine or network (not the API), so they can be told apart.
function explain(t, detail) {
  const err = detail.error || '';
  const last = (detail.exchanges || []).filter((x) => !(x.method === 'DELETE')).slice(-1)[0] || (detail.exchanges || []).slice(-1)[0];
  const got = (err.match(/Received:\s*(\d{3})\b/) || err.match(/HTTP (\d{3})/) || [])[1] || (last && last.status ? String(last.status) : '');
  const want = (err.match(/Expected:\s*(\d{3})\b/) || [])[1] || '';
  const serverMessage = ((err.match(/"Message":"([^"]{5,200})"/) || [])[1] || '').replace(/\\r\\n/g, ' ');
  if (/ECONNRESET|socket hang up|ECONNREFUSED/i.test(err)) return { net: true, text: 'The connection to the test server was cut while this test was running. That is a network problem on the way to the server, not a fault found in the API. Run the test again; if it keeps happening, check the network or VPN.' };
  if (/Timeout \d+ms exceeded|timed out/i.test(err)) return { net: true, text: 'The server did not answer in time (the test waits up to 30 seconds). The server or the network was too slow, which is not necessarily a fault in the API. Run the test again.' };
  if (/ENOTFOUND|EAI_AGAIN/i.test(err)) return { net: true, text: 'The test machine could not find the server address (a DNS or internet problem). No request reached the API. Check the connection and run the test again.' };
  if (got === '429') return { net: true, text: 'The API refused the request because too many requests were sent in a short time (a rate limit). Wait a few minutes and run the test again.' };
  if (got === '401' && want !== '401') return { net: true, text: 'The API said the login is not valid (401). The saved login probably expired. Run again so a fresh login is used.' };
  const said = serverMessage ? ' The API said: "' + serverMessage + '".' : '';
  if (/^5/.test(got) && !/^5/.test(want)) return { text: 'The API crashed or failed on its own side (error ' + got + ') for a request that should have been answered with a clear message' + (want ? ' (a ' + want + ' answer was expected)' : '') + '. A wrong request must be refused with a plain 4xx answer, not a server error.' + said };
  if (got && want && got !== want) return { text: 'The API answered ' + got + ' but the correct answer is ' + want + '.' + said };
  if (/^2/.test(got) && /toBe\(false\)|toBe\(true\)|toEqual|toContain|toBeGreater/.test(err + '')) return { text: 'The API accepted the request, but what it returned or did is not what it should be. Open the request and the response below to see the difference.' + said };
  if (/Expected/.test(err) && /Received/.test(err)) return { text: 'The API answered, but a value in the answer is different from what the test expects. The error below shows what was expected and what came back.' + said };
  return { text: 'The test stopped because one of its checks did not hold. Open the requests and responses below to see what was sent and what came back.' + said };
}

async function fillBody(d, t, focusEndpoint) {
  const body = el('div', 'body', 'Loading...');
  d.appendChild(body);
  const where = new URLSearchParams({ file: t.file || '', group: t.group || '', title: t.title || '' });
  const detail = await (await fetch('/api/test/' + encodeURIComponent(t.id) + '?' + where)).json().catch(() => ({ exchanges: [] }));
  detail.exchanges = detail.exchanges || [];
  body.replaceChildren(el('div', 'gname', `${t.file}:${t.line}` + (t.group ? '  |  ' + t.group : '')));
  // Not run on this page yet: the requests below come from the newest saved run of this test.
  const notRunHere = t.status === 'queued' || t.status === 'running' || !t.status;
  if (detail.from) {
    const d0 = new Date(detail.from.startedAt);
    body.appendChild(el('div', 'note info', `This test has not run here yet. Showing its requests and responses from the last saved run: ${detail.from.name}, ${isNaN(d0) ? '' : d0.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} (${(LABEL[detail.from.status] || detail.from.status || '').toLowerCase()}).`));
  }
  if (notRunHere) {   // an earlier run's error or skip reason does not belong to this page: show only its requests
    if (!detail.exchanges.length) body.appendChild(el('div', 'gname', 'This test has not run yet and no saved run has its requests. Click Run to see what it sends and gets back.'));
    detail.exchanges.forEach((x, i) => body.appendChild(exchange(x, i === 0)));
    return;
  }
  if (detail.skipReason) body.appendChild(el('div', 'note', 'Skipped: ' + detail.skipReason));
  if (detail.error && (t.status === 'failed' || t.status === 'defect')) {
    const why = explain(t, detail);
    body.appendChild(el('div', 'plain' + (why.net ? ' net' : ''), null, [el('b', '', why.net ? 'What went wrong (not an API fault)' : t.status === 'defect' ? 'What went wrong (a known problem in the API)' : 'What went wrong'), el('span', '', why.text)]));
  }
  if (detail.error) body.appendChild(el('div', 'err', detail.error));
  const list = focusEndpoint ? detail.exchanges.filter((x) => x.endpoint === focusEndpoint) : detail.exchanges;
  if (!detail.exchanges.length) body.appendChild(el('div', 'gname', t.status === 'skipped' ? 'No requests were sent.' : 'No requests were recorded for this test.'));
  list.forEach((x) => body.appendChild(exchange(x, t.status !== 'passed' && (focusEndpoint || detail.exchanges.length <= 2))));
}

// Opens the page that shows what will be published to ADO for this one test (nothing is created until Create is clicked there).
function bugButton(t) {
  const b = el('button', 'btn ado small', 'Create a defect on ADO');
  b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); window.open('/bug?id=' + encodeURIComponent(t.id), '_blank'); });
  return b;
}
const testSummary = (t) => el('summary', '', null, [pill(t.status), el('span', 'ttl', t.title), el('span', 'gname', t.group || t.file), el('span', 'nums', t.status === 'queued' || t.status === 'running' ? '' : t.ms + ' ms'),
  t.status === 'defect' || t.status === 'failed' ? bugButton(t) : null]);
const rowFor = new Map(); // id -> row in the test list

function testRow(t, focusEndpoint) {
  const d = el('details', 'row');
  d.id = (focusEndpoint ? 'e-' : 't-') + t.id;
  d.appendChild(testSummary(t));
  if (!focusEndpoint) rowFor.set(t.id, d);
  let loaded = false;
  d.addEventListener('toggle', () => {
    if (!focusEndpoint) d.open ? openIds.add(t.id) : openIds.delete(t.id);
    if (d.open && !loaded) { loaded = true; fillBody(d, t, focusEndpoint); }
  });
  if (!focusEndpoint && openIds.has(t.id)) d.open = true;
  return d;
}

function renderTests() {
  const q = $('tcq').value.toLowerCase(), f = $('tcf').value;
  const list = [...tests.values()].filter((t) => (!f || t.status === f) && (!q || (t.title + ' ' + t.group + ' ' + t.file + ' ' + t.error + ' ' + t.skipReason).toLowerCase().includes(q)));
  // The "x of y" count shows only while a search or filter narrows the list.
  $('tcc').textContent = q || f ? list.length + ' of ' + tests.size + ' test cases' : '';
  const box = $('tclist');
  const scroll = window.scrollY;
  box.replaceChildren();
  rowFor.clear();
  if (!list.length) box.appendChild(el('div', 'empty', tests.size ? 'No test cases match.' : 'No run yet. Start the suite with npm test.'));
  let last = '';
  list.forEach((t) => {
    if (t.file !== last) { last = t.file; box.appendChild(el('div', 'head', t.file)); }
    box.appendChild(testRow(t));
  });
  window.scrollTo(0, scroll);
}

// ---- endpoints ----
async function renderEndpoints() {
  const E = await (await fetch('/api/endpoints')).json();
  const q = $('epq').value.toLowerCase(), f = $('epf').value;
  const list = E.filter((e) => (!f || (f === 'auto' && e.automated) || (f === 'no' && !e.automated) || (f === 'fail' && e.failed > 0) || (f === 'defect' && e.defect > 0)) &&
    (!q || (e.path + ' ' + e.tag + ' ' + e.summary + ' ' + e.method).toLowerCase().includes(q)));
  $('epc').textContent = q || f ? list.length + ' of ' + E.length + ' endpoints' : '';
  const box = $('eplist'); box.replaceChildren();
  if (!E.length) box.appendChild(el('div', 'empty', 'The API spec has not been downloaded yet; it appears when a run starts.'));
  let last = '';
  list.forEach((e) => {
    if (e.tag !== last) { last = e.tag; const g = E.filter((x) => x.tag === e.tag); box.appendChild(el('div', 'head', `${e.tag}  (${g.filter((x) => x.automated).length}/${g.length} automated)`)); }
    const d = el('details', 'row erow');
    d.appendChild(el('summary', '', null, [method(e.method), el('span', 'path', e.path, [e.summary ? el('small', '', e.summary) : null]),
      el('span', 'pill ' + (e.automated ? 'p-auto' : 'p-no'), e.automated ? 'AUTOMATED' : 'NOT AUTOMATED'),
      el('span', 'nums', null, e.automated && !e.tests.length ? [document.createTextNode('not run yet')] : e.automated ? [el('b', 'n-pass', e.passed + ' pass'), document.createTextNode(' / '), el('b', 'n-def', e.defect + ' known defect'), document.createTextNode(' / '), el('b', 'n-fail', e.failed + ' fail'), document.createTextNode(' / '), el('b', 'n-skip', e.skipped + ' skip')] : [])]));
    d.addEventListener('toggle', () => {
      if (!d.open || d.dataset.done) return;
      d.dataset.done = 1;
      const b = el('div', 'body');
      if (!e.automated || !e.tests.length) b.appendChild(el('div', 'note', e.note));
      else {
        b.appendChild(el('div', 'gname', 'Scenarios that send a request to this endpoint:'));
        e.tests.sort((a, c) => ORDER.indexOf(a.status) - ORDER.indexOf(c.status)).forEach((t) => {
          const full = tests.get(t.id);
          const r = testRow(full, e.key);
          if (t.status === 'failed' || t.status === 'defect') r.open = true;
          b.appendChild(r);
        });
      }
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}

// ---- coverage of the module on this page ----
// The endpoints this module's own tests send requests to, out of every endpoint in the API. Shown only on a module page.
async function renderCoverage() {
  if (!modId) return;
  const C = await (await fetch('/api/module-coverage?module=' + encodeURIComponent(modId))).json();
  if (C.error) { $('covlist').replaceChildren(el('div', 'empty', C.error)); return; }
  // "Everything" is calculated from its modules (their covered and total endpoints added up); a single module from its own endpoints.
  const A = C.across;
  const covered = A ? A.covered : C.covered, total = A ? A.total : C.total;
  const pct = total ? Math.round((covered / total) * 100) : 0;
  const cards = A
    ? [[covered, 'module endpoints covered, added up over all modules', 'c-ok'], [total - covered, 'module endpoints not covered', 'c-bad'], [total, 'module endpoints in total (one used by several modules counts in each)', ''],
       [pct + '%', 'coverage of Everything, from its modules (' + A.uniqueCovered + ' of the ' + A.uniqueTotal + ' API endpoints are used by at least one module)', 'c-info']]
    : [[covered, 'of this module\'s endpoints are covered', 'c-ok'], [total - covered, 'of this module\'s endpoints are not covered', 'c-bad'], [total, 'endpoints belong to this module', ''],
       [pct + '%', 'coverage of this module' + (C.extra ? ' (its tests also use ' + C.extra + ' other endpoints)' : ''), 'c-info']];
  $('covcards').replaceChildren(...cards.map(([n, l, c]) => el('div', 'card ' + c, null, [el('b', '', n), el('span', '', l)])));
  // "Everything" also shows the coverage of each module; a row opens that module's page.
  $('covmods').hidden = !C.modules;
  if (C.modules) {
    $('covmods').replaceChildren(el('div', 'head', 'Coverage by module'), ...C.modules.map((m) => {
      const p = m.total ? Math.round((m.covered / m.total) * 100) : 0;
      const bar = el('div', 'modbar', null, [el('i')]); bar.firstChild.style.width = p + '%';
      const r = el('a', 'modrow', null, [el('span', 'modname2', m.name), bar, el('span', 'nums', m.covered + ' of ' + m.total + ' endpoints'), el('b', p === 100 ? 'n-pass' : p >= 50 ? 'n-skip' : 'n-fail', p + '%')]);
      r.href = '/?module=' + encodeURIComponent(m.id) + '&tab=coverage'; r.target = '_blank';
      return r;
    }));
  }
  const q = $('covq').value.toLowerCase(), f = $('covf').value;
  const list = C.endpoints.filter((e) => (!f || (f === 'covered' && e.covered) || (f === 'not' && !e.covered)) && (!q || (e.path + ' ' + e.tag + ' ' + e.summary + ' ' + e.method).toLowerCase().includes(q)));
  $('covc').textContent = q || f ? list.length + ' of ' + C.total + ' endpoints' : '';
  const box = $('covlist'); box.replaceChildren();
  if (!list.length) box.appendChild(el('div', 'empty', 'No endpoints match.'));
  let last = '';
  list.forEach((e) => {
    if (e.tag !== last) { last = e.tag; const g = C.endpoints.filter((x) => x.tag === e.tag); box.appendChild(el('div', 'head', `${e.tag}  (${g.filter((x) => x.covered).length}/${g.length} covered)`)); }
    const d = el('details', 'row erow');
    const ran = e.tests.length > 0;
    d.appendChild(el('summary', '', null, [method(e.method), el('span', 'path', e.path, [e.summary ? el('small', '', e.summary) : null]),
      el('span', 'pill ' + (e.covered ? 'p-auto' : 'p-no'), e.covered ? 'COVERED' : 'NOT COVERED'),
      el('span', 'nums', null, !e.covered ? [] : !ran ? [document.createTextNode('not run yet')] :
        [el('b', 'n-pass', e.passed + ' pass'), document.createTextNode(' / '), el('b', 'n-def', e.defect + ' known defect'), document.createTextNode(' / '), el('b', 'n-fail', e.failed + ' fail'), document.createTextNode(' / '), el('b', 'n-skip', e.skipped + ' skip')])]));
    d.addEventListener('toggle', () => {
      if (!d.open || d.dataset.done) return;
      d.dataset.done = 1;
      const b = el('div', 'body');
      if (!e.covered) b.appendChild(el('div', 'note', 'No test of this module sends a request to this endpoint.'));
      else {
        b.appendChild(el('div', 'gname', 'Tests of this module that send a request to this endpoint' + (ran ? '' : ' (not run yet):')));
        const norm = (g) => (g || '').replace(/ › /g, ' > ');
        // each test with its result on this page: waiting tests are plain rows, tests that have run open to show their requests
        const rows = e.known.map((k) => {
          const full = [...tests.values()].find((t) => t.file === k.file && t.title === k.title && norm(t.group) === norm(k.group));
          return { k, full };
        }).sort((a, c) => ORDER.indexOf(a.full ? a.full.status : 'queued') - ORDER.indexOf(c.full ? c.full.status : 'queued'));
        rows.forEach(({ k, full }) => {
          if (full && full.status !== 'queued' && full.status !== 'running') {
            const r = testRow(full, e.key);
            if (full.status === 'failed' || full.status === 'defect') r.open = true;
            b.appendChild(r);
          } else {
            b.appendChild(el('div', 'row plainrow', null, [pill(full ? full.status : 'queued'), el('span', 'ttl', k.title), el('span', 'gname', k.group || k.file)]));
          }
        });
        if (!rows.length) b.appendChild(el('div', 'note', 'No test is known for this endpoint yet.'));
      }
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}

// ---- wiring ----
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  $('tc').hidden = b.dataset.tab !== 'tc'; $('cov').hidden = b.dataset.tab !== 'cov'; $('ep').hidden = b.dataset.tab !== 'ep';
  if (b.dataset.tab === 'ep') renderEndpoints();
  if (b.dataset.tab === 'cov') renderCoverage();
}));
['tcq', 'tcf'].forEach((id) => $(id).addEventListener('input', renderTests));
['epq', 'epf'].forEach((id) => $(id).addEventListener('input', renderEndpoints));
['covq', 'covf'].forEach((id) => $(id).addEventListener('input', renderCoverage));
$('tcx').addEventListener('click', () => document.querySelectorAll('#tclist > details').forEach((d) => { if (/FAILED|KNOWN DEFECT/.test(d.querySelector('summary').innerText)) d.open = true; }));
$('tcz').addEventListener('click', () => document.querySelectorAll('#tclist details[open]').forEach((d) => (d.open = false)));

function applyState(s) {
  tests.clear();
  s.tests.forEach((t) => tests.set(t.id, t));
  run = s;
  openIds.clear();
  renderHeader(); renderTests();
  if (!$('ep').hidden) renderEndpoints();
  if (!$('cov').hidden) renderCoverage();
}

// Test events can arrive in bursts; redraw at most a few times a second.
// A changed test only has its own row's summary replaced, so rows the user has open stay as they are.
let pending = false;
const dirty = new Set();
function schedule() {
  if (pending) return;
  pending = true;
  setTimeout(() => {
    pending = false;
    renderHeader();
    const filtered = $('tcq').value || $('tcf').value;
    if (filtered) renderTests();
    else dirty.forEach((id) => { const row = rowFor.get(id); if (row) row.replaceChild(testSummary(tests.get(id)), row.querySelector('summary')); });
    dirty.clear();
  }, 400);
}

const source = new EventSource('/events');
source.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === 'state') applyState(ev.state);
  else if (ev.type === 'test') { tests.set(ev.test.id, ev.test); dirty.add(ev.test.id); run.status = run.status === 'idle' ? 'running' : run.status; schedule(); }
};
setInterval(() => { if (run.status === 'running') renderHeader(); }, 1000);

// ---- request limit: the suite pauses itself to stay under the API's limit; say so, so the run does not look stuck ----
var pause = null, pauseSkew = 0;   // var: renderHeader may run before this line
async function pollPause() {
  if (run.status !== 'running') { pause = null; return; }
  try { pause = await (await fetch('/api/pause', { cache: 'no-store' })).json(); } catch { pause = null; }
  if (pause) pauseSkew = Date.now() - pause.now;
}
setInterval(pollPause, 2000);
function pauseNote() {
  if (!pause) return [];
  const left = Math.max(0, Math.ceil((pause.until + pauseSkew - Date.now()) / 1000));
  const why = pause.reason === '429' ? 'The server said "too many requests"; waiting for its limit to reset' : 'Waiting for the request limit (80 calls per 3 minutes)';
  return [el('span', 'paused', why + (left ? ' - carries on in about ' + (left >= 60 ? Math.floor(left / 60) + ' min ' + (left % 60) + ' s' : left + ' s') : ' - carrying on now') + '. Not stuck.')];
}

// Saved runs and Report Analysis are opened from the side menu (scripts/nav.js).
// ---- opened from the runner page with ?module=<id>: show a Run button and start the run only when it is clicked ----
const modId = new URLSearchParams(location.search).get('module');
let modInfo = null, clickedAt = 0;
const say = (text, bad) => { const m = $('modmsg'); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); m.hidden = !text; };
async function pollModule() {
  let info; try { info = await (await fetch('/api/modules', { cache: 'no-store' })).json(); } catch { return; }
  const job = info.job && info.job.module === modId ? info.job : null;
  const live = run.status === 'running' && clickedAt && new Date(run.startedAt) >= clickedAt - 2000;
  $('gorun').disabled = !!(info.job && info.job.running);
  $('gostop').hidden = !(info.job && info.job.running);
  $('gorun').textContent = clickedAt && run.status === 'finished' ? 'Run again' : 'Run';
  if (job && job.running && !live) say(job.login === undefined ? 'Starting...' : 'Starting: ' + job.login + '. Loading the tests...');
  else if (job && !job.running && clickedAt && tests.size === 0) say('The run ended without running any test (exit code ' + job.exit + '). Last output:\n' + job.tail.join('\n'), true);
  else if (live) say('');
}
// The tests of the module are listed (as waiting) before anything is run.
async function showPlanned() {
  let rows = [];
  try { rows = await (await fetch('/api/module-tests?module=' + encodeURIComponent(modId))).json(); } catch { return; }
  if (run.status === 'idle' || run.status === undefined) applyState({ status: 'idle', startedAt: null, finishedAt: null, dealer: run.dealer, tests: rows });
}
async function initModule() {
  await fetch('/api/run-fresh', { method: 'POST' }).catch(() => {});
  showPlanned();
  const info = await (await fetch('/api/modules', { cache: 'no-store' })).json();
  modInfo = info.modules.find((m) => m.id === modId);
  // The module's name is shown in the breadcrumb (Home > module), not next to Run.
  $('gorun').hidden = false; $('goreset').hidden = false; $('covtab').hidden = !modInfo;
  // Opened from a row of "Coverage by module": start on the Coverage tab.
  if (modInfo && new URLSearchParams(location.search).get('tab') === 'coverage') $('covtab').click();
  if (!modInfo) { $('crumbname').textContent = 'Unknown module'; $('gorun').disabled = true; say('There is no module "' + modId + '". Go back to the runner page and choose one.', true); return; }
  document.title = modInfo.name + ' - Integration Tests Live Runner';
  $('crumbname').textContent = modInfo.name; $('crumbname').title = modInfo.description; $('gorun').title = 'Run: ' + modInfo.name;
  $('gorun').addEventListener('click', async () => {
    if (modInfo.finalizes && !confirm('"' + modInfo.name + '" really checks orders out. That finalizes orders, uses stock and leaves payments behind on the test dealer.\n\nRun it?')) return;
    clickedAt = Date.now(); $('gorun').disabled = true; say('Starting...');
    const out = await (await fetch('/api/run', { method: 'POST', body: JSON.stringify({ module: modId }) })).json().catch((e) => ({ error: String(e) }));
    if (out.error) { clickedAt = 0; $('gorun').disabled = false; say('Could not start: ' + out.error, true); }
  });
  $('gostop').addEventListener('click', async () => { $('gostop').disabled = true; say('Stopping...'); await fetch('/api/run-stop', { method: 'POST' }); setTimeout(() => { $('gostop').disabled = false; pollModule(); }, 1500); });
  $('goreset').addEventListener('click', async () => {
    $('goreset').disabled = true;
    await fetch('/api/run-reset', { method: 'POST' });
    clickedAt = 0; say(''); showPlanned(); $('gorun').disabled = false; $('gorun').textContent = 'Run'; $('gostop').hidden = true;
    $('goreset').disabled = false; pollModule();
  });
  setInterval(pollModule, 1500); pollModule();
}
if (modId) initModule();
</script>
</body>
